[package]
name = "lain_wave"
version = "0.3.2"
description = "Lain Wave is a highly optimized music management system built for speed and reliability. It is engineered to work entirely offline, ensuring that your library remains fully accessible without any internet dependency. The application includes an integrated tool to download tracks directly from YouTube, allowing you to build and maintain a permanent local archive effortlessly."
authors = ["Fahrettin Baştürk"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "lainwave_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
tauri = { version = "2.10.3", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-opener = "2.5.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
id3 = "1.16.4"
discord-presence = "3.2.0"
tauri-plugin-global-shortcut = "2.3.1"
rusqlite = { version = "0.39.0", features = ["bundled"] }
